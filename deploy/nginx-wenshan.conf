# ------------------------------------------------------------------
# WenShan Nginx site configuration — HTTP (no domain)
# Deploy to: /etc/nginx/sites-available/wenshan
# Link:      ln -s /etc/nginx/sites-available/wenshan /etc/nginx/sites-enabled/
# Test:      nginx -t
# Reload:    systemctl reload nginx
#
# Prerequisites:
#   - Node.js backend running on 127.0.0.1:3001 (managed by PM2)
#   - Frontend built to /var/www/wenshan/dist
# ------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # ── Static files root ─────────────────────────────────────
    root /var/www/wenshan/dist;
    index index.html;

    # ── API reverse proxy ─────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for DeepSeek API (may be slow)
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;
    }

    # ── Static assets: long cache ─────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/wenshan-access.log;
    error_log  /var/log/nginx/wenshan-error.log warn;
}
